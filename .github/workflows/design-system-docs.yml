# Rebuilds the design-system CSS and Storybook docs on every push to main,
# then publishes the docs to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Design system docs

on:
  push:
    branches: [main]
    paths: ['design-system/**', '.github/workflows/design-system-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - name: Check committed CSS matches the tokens
        run: git diff --exit-code -- dist/ || (echo "::error::dist/ is out of date. Run npm run build and commit." && exit 1)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design-system/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
